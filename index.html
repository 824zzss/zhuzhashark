<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FFB6C7" />
  <title>猪猪鲨手 · 个人成长工作台</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <!-- 左侧导航栏 (PC 横屏) -->
    <aside id="sidebar">
      <div class="brand">
        <div class="brand-logo">🐷🦈</div>
        <div class="brand-text">
          <div class="brand-name">猪猪鲨手</div>
          <div class="brand-sub">个人成长工作台</div>
        </div>
      </div>
      <nav id="nav"></nav>
      <div class="sidebar-foot">
        <button class="ghost-btn" id="openSettings">⚙️ 设置</button>
      </div>
    </aside>

    <!-- 右侧内容区 -->
    <main id="content">
      <header id="topbar">
        <button class="icon-btn mobile-only" id="menuBtn" aria-label="菜单">☰</button>
        <h1 id="pageTitle">每日计划</h1>
        <span id="pageEmoji" class="page-emoji">📅</span>
        <div class="topbar-spacer"></div>
        <div id="todayChip" class="today-chip"></div>
      </header>
      <section id="view" class="view"></section>
    </main>
  </div>

  <!-- 移动端底部 Tab -->
  <nav id="bottomTabs" class="bottom-tabs"></nav>

  <!-- 全局浮动新建按钮 -->
  <button id="fab" aria-label="新建任务">➕</button>

  <!-- 弹窗容器 -->
  <div id="modalRoot"></div>

  <!-- 撒花画布 -->
  <canvas id="confetti"></canvas>

  <script src="js/db.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/sections/placeholder.js"></script>
  <script src="js/sections/dashboard.js"></script>
  <script src="js/sections/daily-plan.js"></script>
  <script src="js/sections/notes.js"></script>
  <script src="js/sections/new-task.js"></script>
  <script src="js/sections/words.js"></script>
  <script src="js/sections/health.js"></script>
  <script src="js/sections/english.js"></script>
  <script src="js/sections/review.js"></script>
  <script src="js/sections/sidehustle.js"></script>
  <script src="js/sections/inspiration.js"></script>
  <script src="js/sections/podcast.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
